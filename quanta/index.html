<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2300a2ff' rx='15' width='100' height='100'/><text x='50' y='65' text-anchor='middle' font-size='50' font-weight='bold' fill='white'>Q</text></svg>">

                        <input type="text" placeholder="Search games, people, or items...">
